<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyJapaneseQuest</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(120deg, #f0f0f0, #e0f7fa);
            text-align: center;
            color: #0b1215;
        }
        .header {
            background-color: #3498db;
            color: white;
            padding: 40px 20px;
            border-bottom-left-radius: 50px;
            border-bottom-right-radius: 50px;
            position: relative;
        }
        .header img {
            width: 100px;
            height: 100px;
            display: block;
            margin: 0 auto 20px auto;
        }
        .header h1 {
            margin: 0;
            font-size: 2.5em;
        }
        .header p {
            margin: 10px 0 0 0;
            font-size: 1.2em;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 10px;
            padding: 20px;
        }
        .container div {
            padding: 20px;
            color: white;
            font-size: 1.2em;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            transition: transform 0.2s;
        }
        .container div:hover {
            transform: scale(1.05);
        }
        .container div a {
            color: white;
            text-decoration: none;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cultural-challenge {
            background-color: #2ecc71;
        }
        .grammar-challenge {
            background-color: #e67e22;
        }
        .download {
            background-color: #1abc9c;
        }
        .qa {
            background-color: #f39c12;
        }
        .testimonial {
            background-color: #f1c40f;
        }
        .pricing {
            background-color: #253f4b;
        }
        .footer {
            background-color: #ffffff;
            padding: 20px 0;
            color: #0b1215;
            font-size: 1.5em;
            text-align: center;
            border-top: 1px solid #e0e0e0;
        }
        .footer a {
            color: #0b1215;
            text-decoration: none;
            font-weight: bold;
            margin: 0 10px;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .footer img {
            width: 40px;
            height: 40px;
            margin: 0 10px;
        }
        .menu {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 30px;
            cursor: pointer;
            z-index: 1000;
            color: #0b1215;
        }
        .sidenav {
            height: 100%;
            width: 0;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #111;
            overflow-x: hidden;
            transition: 0.5s;
            padding-top: 60px;
            z-index: 999;
        }
        .sidenav a {
            padding: 8px 8px 8px 32px;
            text-decoration: none;
            font-size: 25px;
            color: #818181;
            display: block;
            transition: 0.3s;
        }
        .sidenav a:hover {
            color: #f1f1f1;
        }
        .sidenav .closebtn {
            position: absolute;
            top: 0;
            right: 25px;
            font-size: 36px;
            margin-left: 50px;
        }
    </style>
</head>
<body>
    <div id="mySidenav" class="sidenav">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        <a href="index.html">Home</a>
        <a href="sample-materials.html">Sample Materials</a>
        <a href="qa.html">Q&A</a>
        <a href="testimonial.html">Testimonial</a>
        <a href="pricing.html">Pricing</a>
    </div>

    <span class="menu" onclick="openNav()">&#9776;</span>

    <div class="header">
        <img src="logo1.png" alt="MyJapaneseQuest Logo">
        <h1>MyJapaneseQuest</h1>
        <p>YOUR PERSONALISED LEARNING EXPERIENCE</p>
    </div>

    <div class="footer">
        <a href="https://www.instagram.com/myjapanesequest/" target="_blank">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram">
        </a>
        <a href="https://www.tiktok.com/@myjapanesequest?_t=8oMxl1JoWv2&_r=1" target="_blank">
            <img src="tiktok1.png" alt="TikTok">
        </a>
        <a href="mailto:japanesetutorinabudhabi@gmail.com">
            <img src="https://upload.wikimedia.org/wikipedia/commons/4/4e/Gmail_Icon.png" alt="Email">
        </a>
    </div>

    <script>
        function openNav() {
            document.getElementById("mySidenav").style.width = "250px";
        }

        function closeNav() {
            document.getElementById("mySidenav").style.width = "0";
        }
    </script>
</body>
</html>
